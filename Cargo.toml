[package]
name = "opencode-token-dashboard"
version = "0.3.0"
edition = "2021"
description = "Native Rust dashboard for OpenCode token usage"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
tera = "2"
eframe = "0.37"
egui = "0.37"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 2
lto = true
strip = true
