openapi: 3.1.0
info:
  title: OpenCode Token Dashboard API
  version: 1.0.0
  description: |
    Local, read-only API served by the dashboard binary in `--web` mode.
    Consumers are the native GUI and the browser dashboard on the same machine.
    No authentication and no rate limits: the server binds to 127.0.0.1 by default
    and must not be exposed to an untrusted network.
servers:
  - url: http://127.0.0.1:3000
    description: Local dashboard server

paths:
  /api/v1/usage:
    get:
      summary: Full usage snapshot
      operationId: getUsage
      responses:
        "200":
          description: Current usage totals and all breakdowns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSnapshot"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/usage/daily:
    get:
      summary: Daily rows for the selected range
      operationId: getDailyUsage
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [30d, all]
            default: 30d
      responses:
        "200":
          description: Newest-first daily rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DayUsage"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/usage/sessions:
    get:
      summary: Searchable, sortable sessions
      operationId: getSessions
      parameters:
        - name: q
          in: query
          schema:
            type: string
            default: ""
        - name: sort
          in: query
          schema:
            type: string
            enum: [label, updatedAt, input, output, reasoning, cacheRead, fresh, total]
            default: total
        - name: dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Matching sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionUsage"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/usage/costs:
    get:
      summary: Cost estimates from the user's pricing file
      operationId: getCosts
      description: Returns empty rows when no pricing.json is configured.
      responses:
        "200":
          description: Cost summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostSummary"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/settings:
    get:
      summary: Read local UI settings
      operationId: getSettings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      summary: Replace local UI settings
      operationId: putSettings
      description: Idempotent. Full resource replacement; unknown fields are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "422":
          description: Invalid settings body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  responses:
    ServerError:
      description: Database or configuration error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [database_error, invalid_settings]
            message:
              type: string

    Counts:
      type: object
      required: [input, output, reasoning, cacheRead, cacheWrite]
      properties:
        input: { type: integer, format: int64 }
        output: { type: integer, format: int64 }
        reasoning: { type: integer, format: int64 }
        cacheRead: { type: integer, format: int64 }
        cacheWrite: { type: integer, format: int64 }

    Totals:
      allOf:
        - $ref: "#/components/schemas/Counts"
        - type: object
          required: [fresh, total]
          properties:
            fresh: { type: integer, format: int64 }
            total: { type: integer, format: int64 }

    DayUsage:
      allOf:
        - $ref: "#/components/schemas/Totals"
        - type: object
          required: [day]
          properties:
            day: { type: string, examples: ["2026-11-18"] }

    NamedUsage:
      allOf:
        - $ref: "#/components/schemas/Totals"
        - type: object
          required: [key, label, messages]
          properties:
            key: { type: string }
            label: { type: string }
            messages: { type: integer, format: int64 }

    SessionUsage:
      allOf:
        - $ref: "#/components/schemas/NamedUsage"
        - type: object
          required: [model, project, updatedAt]
          properties:
            model: { type: string }
            project: { type: string }
            updatedAt: { type: integer, format: int64 }

    UsageSnapshot:
      type: object
      required:
        [dbPath, messageCount, today, yesterday, sevenDayAverage, allTime, perDay, sessions, models, projects]
      properties:
        dbPath: { type: string }
        messageCount: { type: integer }
        today: { $ref: "#/components/schemas/Totals" }
        yesterday: { $ref: "#/components/schemas/Totals" }
        sevenDayAverage: { $ref: "#/components/schemas/Totals" }
        allTime: { $ref: "#/components/schemas/Totals" }
        perDay:
          type: array
          items: { $ref: "#/components/schemas/DayUsage" }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/SessionUsage" }
        models:
          type: array
          items: { $ref: "#/components/schemas/NamedUsage" }
        projects:
          type: array
          items: { $ref: "#/components/schemas/NamedUsage" }

    CostSummary:
      type: object
      required: [configured, totalUsd, rows]
      properties:
        configured: { type: boolean }
        totalUsd: { type: number, format: double }
        rows:
          type: array
          items:
            type: object
            required: [model, messages, totalUsd]
            properties:
              model: { type: string }
              messages: { type: integer, format: int64 }
              totalUsd: { type: number, format: double }

    Settings:
      type: object
      required: [autoSyncSeconds, allDays]
      properties:
        autoSyncSeconds:
          type: integer
          enum: [0, 1, 5, 15, 60]
        allDays: { type: boolean }
